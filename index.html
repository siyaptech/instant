<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Fallback only: the real title comes from LABELS.pageTitle in js/labels.js -->
<title>Arena Duel Game - Beta Version V1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/overlays.css">

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<!--
  Text is filled in from js/labels.js:  data-label="path.to.key"
  Difficulty buttons are generated from DIFFICULTY in js/config.js.
-->
<div id="game"></div>

<!-- ================= In-game HUD ================= -->
<div id="hud">
  <div id="top">
    <div class="sc p"><span data-label="hud.you"></span><b id="sP">0</b></div>
    <div id="goal" data-label="hud.goal"></div>
    <div class="sc e"><b id="sE">0</b><span data-label="hud.bot"></span></div>
  </div>
  <div id="ehp"><div id="ehpFill"></div></div>
  <canvas id="mini" width="170" height="170"></canvas>
  <div id="cross"></div>
  <div id="hitm"></div>
  <div id="dmgInd"><div></div></div>
  <div id="hpBox" class="box">
    <label data-label="hud.health"></label><span id="hpNum"></span>
    <div class="bar"><div id="hpFill"></div></div>
  </div>
  <div id="ammoBox" class="box">
    <label data-label="hud.ammo"></label>
    <div><span id="ammo"></span><small data-label="hud.ammoMax"></small></div>
    <div id="reload" data-label="hud.reloading"></div>
  </div>
  <div id="keysHint" data-label="hud.keysHint"></div>
  <div id="msg"></div>
  <div id="lowhp"></div>
  <div id="flash"></div>
</div>

<!-- ================= Main menu ================= -->
<div id="menu" class="overlay on">
  <div class="card">
    <h1 data-label="title"></h1>
    <p class="sub" data-label="tagline"></p>
    <div class="controls">
      <span data-label="controls.moveKeys"></span><span data-label="controls.move"></span>
      <span data-label="controls.turnKeys"></span><span data-label="controls.turn"></span>
      <span data-label="controls.shootKeys"></span><span data-label="controls.shoot"></span>
      <span data-label="controls.miscKeys"></span><span data-label="controls.misc"></span>
    </div>
    <div class="diff" data-difficulty-picker></div>
    <button class="go" id="startBtn" data-label="menu.start"></button>
    <p class="note" data-label="menu.note"></p>
  </div>
</div>

<!-- ================= Pause ================= -->
<div id="pause" class="overlay">
  <div class="card">
    <h1 data-label="pause.title"></h1>
    <p class="sub" data-label="pause.hint"></p>
    <button class="go" id="resumeBtn" data-label="pause.resume"></button>
  </div>
</div>

<!-- ================= Game over ================= -->
<div id="over" class="overlay">
  <div class="card">
    <h1 id="overTitle"></h1>
    <p class="sub" id="overSub"></p>
    <div class="stats">
      <div><span data-label="over.score"></span><b id="stScore"></b></div>
      <div><span data-label="over.accuracy"></span><b id="stAcc"></b></div>
      <div><span data-label="over.damage"></span><b id="stDmg"></b></div>
    </div>
    <div class="diff" data-difficulty-picker></div>
    <button class="go" id="againBtn" data-label="over.again"></button>
    <p class="note" data-label="over.note"></p>
  </div>
</div>
</body>
</html>
